<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Companion's trusted session rail, served only by the native ShellProfile
      from this bundle. No network, frames or inline scripts: session titles
      are untrusted content and must never become code.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Companion sessions</title>
    <link rel="stylesheet" href="rail.css" />
    <script src="qwebchannel.js"></script>
    <script type="module" src="rail.js"></script>
  </head>
  <body>
    <div id="rail"></div>
  </body>
</html>
