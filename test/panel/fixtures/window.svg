    <g fill="#293a51"><rect x="108" y="423" width="850" height="92" rx="12"/><rect x="108" y="536" width="850" height="92" rx="12"/><rect x="108" y="649" width="850" height="92" rx="12"/></g>
    <g font-size="24" fill="#9fc0f7"><text x="140" y="478">01    Capture the question and its context</text><text x="140" y="591">02    Follow the answer in your sidebar</text><text x="140" y="704">03    Come back to the conversation later</text></g>
    <rect x="1040" y="322" width="490" height="510" rx="18" fill="#202b3a"/>
    <text x="1080" y="386" font-size="25">Small details matter</text>
    <g font-size="22" fill="#8ba0b8"><text x="1080" y="446">Your words stay yours.</text><text x="1080" y="493">Screenshots keep their detail.</text><text x="1080" y="540">Conversations have a home.</text></g>
