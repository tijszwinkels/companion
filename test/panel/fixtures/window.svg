  <g font-family="sans-serif" fill="#dce5ef">
    <text x="116" y="40" font-size="22">Companion · synthetic screenshot fixture</text>
    <text x="70" y="154" font-size="18" fill="#8ba0b8">WORKSPACE / DESIGN NOTES</text>
    <text x="70" y="216" font-size="44">A quieter way to work.</text>
    <text x="70" y="264" font-size="23" fill="#8ba0b8">Ask a question. Keep your place. Continue when you’re ready.</text>
